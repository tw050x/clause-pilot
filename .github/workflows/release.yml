# Builds installers for macOS, Windows and Linux and attaches them to a draft
# GitHub release. Triggered by pushing a version tag (e.g. `git tag v0.2.0 && git push --tags`)
# or manually from the Actions tab.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write # electron-builder creates the draft release and uploads assets

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest # .dmg for Apple silicon and Intel
          - os: windows-latest # NSIS installer (.exe)
          - os: ubuntu-latest # AppImage
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build app
        run: npm run build

      # macOS: the Developer ID certificate and Apple's notarization credentials, from the
      # repository's secrets (see docs/releasing.md). Without them the macOS build stops here,
      # rather than publishing an app macOS won't open.
      - name: Check macOS signing secrets
        if: runner.os == 'macOS'
        shell: bash
        env:
          CSC_LINK: ${{ secrets.MAC_CERTIFICATE_P12_BASE64 }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          missing=()
          [ -n "$CSC_LINK" ] || missing+=(MAC_CERTIFICATE_P12_BASE64)
          [ -n "$CSC_KEY_PASSWORD" ] || missing+=(MAC_CERTIFICATE_PASSWORD)
          if [ -n "$APPLE_API_KEY_P8" ] || [ -n "$APPLE_API_KEY_ID" ]; then
            [ -n "$APPLE_API_KEY_P8" ] || missing+=(APPLE_API_KEY_P8)
            [ -n "$APPLE_API_KEY_ID" ] || missing+=(APPLE_API_KEY_ID)
            [ -n "$APPLE_API_ISSUER" ] || missing+=(APPLE_API_ISSUER)
          else
            [ -n "$APPLE_ID" ] || missing+=("APPLE_API_KEY_P8 + APPLE_API_KEY_ID + APPLE_API_ISSUER, or APPLE_ID")
            [ -n "$APPLE_APP_SPECIFIC_PASSWORD" ] || missing+=(APPLE_APP_SPECIFIC_PASSWORD)
            [ -n "$APPLE_TEAM_ID" ] || missing+=(APPLE_TEAM_ID)
          fi
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::macOS signing and notarization need these repository secrets: ${missing[*]} (see docs/releasing.md)"
            exit 1
          fi
          # The API key is a file for notarytool.
          if [ -n "$APPLE_API_KEY_P8" ]; then
            printf '%s' "$APPLE_API_KEY_P8" > "$RUNNER_TEMP/apple-api-key.p8"
            echo "APPLE_API_KEY=$RUNNER_TEMP/apple-api-key.p8" >> "$GITHUB_ENV"
          fi

      # The certificate in a keychain of our own, unlocked for codesign, where electron-builder finds
      # the Developer ID identity. (electron-builder's own keychain from CSC_LINK can't be unlocked
      # for set-key-partition-list on GitHub's macOS runners.)
      - name: Import the Developer ID certificate
        if: runner.os == 'macOS'
        shell: bash
        env:
          P12_BASE64: ${{ secrets.MAC_CERTIFICATE_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.MAC_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD=$(openssl rand -hex 24)
          printf '%s' "$P12_BASE64" | base64 --decode > "$RUNNER_TEMP/developer-id.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/developer-id.p12" -k "$KEYCHAIN" -f pkcs12 -P "$P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security \
            || { echo "::error::The certificate couldn't be imported: check MAC_CERTIFICATE_PASSWORD matches MAC_CERTIFICATE_P12_BASE64."; exit 1; }
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/developer-id.p12"
          security find-identity -v -p codesigning "$KEYCHAIN" | grep -q "Developer ID Application" \
            || { echo "::error::No Developer ID Application identity in the certificate."; exit 1; }
          echo "Signing with: $(security find-identity -v -p codesigning "$KEYCHAIN" | grep -o '"Developer ID Application[^"]*"')"

      - name: Package and publish
        shell: bash
        run: npx electron-builder --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # macOS: the identity from the keychain above (Windows and Linux stay unsigned).
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ runner.os == 'macOS' && 'true' || 'false' }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
