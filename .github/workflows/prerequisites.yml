# Runs on every push, to every branch: the checks any change has to pass.
name: Prerequisites

on:
  push:
    branches: ['**']

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci
        env:
          # Typecheck/build don't need the Electron binary.
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      # The AI response schemas documented in docs/ match the code.
      - name: Documentation matches the code
        run: npm run docs:check
