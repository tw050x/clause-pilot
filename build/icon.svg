<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Clause Pilot app icon: a page (one clause picked out in orange) with a
       navigation arrow. Drawn on Apple's 1024 grid (824 body, 100 margin); the Windows and
       Linux icons crop to the body (scripts/icon.mjs). -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff8352"/>
      <stop offset="1" stop-color="#ee5222"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.22"/>
      <stop offset="0.5" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <filter id="drop" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#7a2408" flood-opacity="0.32"/>
    </filter>
    <filter id="body" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity="0.28"/>
    </filter>
  </defs>

  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#bg)" filter="url(#body)"/>
  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#shine)"/>

  <!-- The page -->
  <g filter="url(#drop)">
    <path d="M286 222 h356 l96 96 v448 a36 36 0 0 1 -36 36 h-416 a36 36 0 0 1 -36 -36 v-508 a36 36 0 0 1 36 -36 z" fill="#fff"/>
    <path d="M642 222 v64 a32 32 0 0 0 32 32 h64 z" fill="#ffd9c9"/>
  </g>

  <!-- Clause number and text -->
  <rect x="312" y="300" width="70" height="30" rx="15" fill="#1c2128"/>
  <rect x="402" y="300" width="200" height="30" rx="15" fill="#c9cfd6"/>
  <rect x="312" y="366" width="380" height="26" rx="13" fill="#c9cfd6"/>
  <rect x="312" y="430" width="330" height="26" rx="13" fill="#c9cfd6"/>
  <rect x="312" y="494" width="290" height="26" rx="13" fill="#ff6633"/>
  <rect x="312" y="558" width="240" height="26" rx="13" fill="#c9cfd6"/>

  <!-- The pilot: a navigation arrow in a badge -->
  <circle cx="688" cy="692" r="138" fill="#1c2128" stroke="#fff" stroke-width="20"/>
  <path d="M688 600 L752 770 L688 734 L624 770 Z" fill="#ff6633" stroke="#ff6633" stroke-width="14" stroke-linejoin="round" transform="rotate(40 688 692)"/>
</svg>
