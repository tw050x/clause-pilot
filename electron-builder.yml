# Packaging for the release workflow (.github/workflows/release.yml).
appId: com.clausepilot.app
productName: Clause Pilot
directories:
  output: release
  # The icons live here (made from build/icon.svg by npm run icon).
  buildResources: build
files:
  - out/**
  - data/**
  - package.json
# macOS: signed with the Developer ID certificate (CSC_LINK / CSC_KEY_PASSWORD) under the
# hardened runtime, then notarized by Apple (APPLE_API_KEY / APPLE_API_KEY_ID / APPLE_API_ISSUER,
# or APPLE_ID / APPLE_APP_SPECIFIC_PASSWORD / APPLE_TEAM_ID), so it opens without a warning.
# The release workflow supplies these from the repository's secrets.
mac:
  category: public.app-category.business
  icon: build/icon.icns
  target:
    - target: dmg
      arch: [arm64, x64]
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  notarize: true
win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch: [x64]
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
linux:
  category: Office
  icon: build/icon.png
  target:
    - target: AppImage
      arch: [x64]
publish:
  provider: github
  owner: tw050x
  repo: clause-pilot
  releaseType: draft
