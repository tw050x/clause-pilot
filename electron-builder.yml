# Packaging for the release workflow (.github/workflows/release.yml).
appId: com.clausepilot.app
productName: Clause Pilot
directories:
  output: release
files:
  - out/**
  - data/**
  - demo/contracts/**
  - demo/recordings/**
  - package.json
# Builds are unsigned for now; macOS will ask users to confirm on first open.
mac:
  category: public.app-category.business
  target:
    - target: dmg
      arch: [arm64, x64]
  identity: null
win:
  target:
    - target: nsis
      arch: [x64]
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
linux:
  category: Office
  target:
    - target: AppImage
      arch: [x64]
publish:
  provider: github
  owner: tw050x
  repo: clause-pilot
  releaseType: draft
