# Packaging for the release workflow (.github/workflows/release.yml).
appId: com.clausepilot.app
productName: Clause Pilot
directories:
  output: release
  # The icons live here (made from build/icon.svg by npm run icon).
  buildResources: build
files:
  - out/**
  - data/**
  - package.json
# Builds are unsigned for now; macOS will ask users to confirm on first open.
mac:
  category: public.app-category.business
  icon: build/icon.icns
  target:
    - target: dmg
      arch: [arm64, x64]
  identity: null
win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch: [x64]
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
linux:
  category: Office
  icon: build/icon.png
  target:
    - target: AppImage
      arch: [x64]
publish:
  provider: github
  owner: tw050x
  repo: clause-pilot
  releaseType: draft
